name: Geographic activity audit patch

on:
  push:
    branches:
      - feature/geographic-activity-audit

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: "!contains(github.event.head_commit.message, '[geo-activity-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/geographic-activity-audit
      - name: Apply audited map patch
        run: python scripts/patch_geographic_activity_map.py
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
      - name: Commit verified source and remove one-shot files
        run: |
          rm scripts/patch_geographic_activity_map.py .github/workflows/geographic-activity-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit geographic sites and add activity drilldown [geo-activity-applied]"
          git push origin HEAD:feature/geographic-activity-audit
