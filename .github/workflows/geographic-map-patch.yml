name: Geographic map patch

on:
  push:
    branches:
      - fix/audit-remediation-20260913

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-remediation-20260913
      - name: Apply geographic map wiring
        run: python scripts/apply_geographic_map_patch.py
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
      - name: Commit verified source and remove one-shot files
        run: |
          rm scripts/apply_geographic_map_patch.py .github/workflows/geographic-map-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Geographic Coverage project map"
          git push origin HEAD:fix/audit-remediation-20260913
