name: Restore project portfolios
on:
  push:
    branches: [feature/indicator-workspace]
    paths:
      - 'frontend/scripts/restore-project-portfolios.mjs'
      - '.github/workflows/restore-project-portfolios.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integration
        run: node frontend/scripts/restore-project-portfolios.mjs
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      - name: Production build
        run: npm run build
        working-directory: frontend
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx frontend/src/pages/ProjectPortfolioAnalysis.jsx
          git diff --cached --quiet || git commit -m "Restore individual project portfolios and search deep links"
          git push
