name: Apply indicator workspace
on:
  push:
    branches: [feature/indicator-workspace]
    paths:
      - 'frontend/scripts/apply-results-workspace.mjs'
      - '.github/workflows/indicator-workspace-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-indicator-workspace
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/feature/indicator-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/indicator-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Integrate existing forms and route
        run: node frontend/scripts/apply-results-workspace.mjs
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Commit validated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx frontend/src/pages/ProjectSetup.jsx frontend/src/pages/MerlReporting.jsx frontend/src/pages/ResultsWorkspace.jsx
          git commit -m 'Integrate indicator editing, progress and evidence into Results workspace'
          git push origin HEAD:feature/indicator-workspace
