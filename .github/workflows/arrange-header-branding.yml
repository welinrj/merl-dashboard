name: Arrange institutional header
on:
  push:
    branches: [feature/arrange-header-branding]
    paths: [.github/workflows/arrange-header-branding.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arrange-header-branding
          persist-credentials: true
      - name: Move public MERL identity to the existing sidebar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/PublicDashboard.jsx')
          text = p.read_text()
          old = '<div className="pbd-head-brand"><img src={CREST} alt=""/><div><strong>MERL</strong><small>DEPARTMENT OF CLIMATE CHANGE (DOCC)</small></div></div>'
          assert text.count(old) == 1, 'Public header branding changed unexpectedly'
          assert '<div className="dsh-brand-title">MERL</div>' in text, 'Sidebar product identity is missing'
          assert text.count('<HeaderPartnerLogos/>') == 1, 'Institutional branding is missing or duplicated'
          p.write_text(text.replace(old, '', 1))
          PY
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/PublicDashboard.jsx
          git commit -m "Keep MERL identity in sidebar and remove duplicate header wordmark"
          git push
