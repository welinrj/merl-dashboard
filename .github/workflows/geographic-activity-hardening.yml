name: Geographic activity hardening

on:
  push:
    branches:
      - feature/geographic-activity-audit

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[geo-hardening-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/geographic-activity-audit
      - name: Patch activity status and map label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/components/GeographicCoverageMap.jsx')
          s=p.read_text()
          s=s.replace("const activityStarted = (activity) => !['not_started', 'cancelled'].includes(String(activity?.status || '').toLowerCase());", "const activityStarted = (activity) => ['in_progress', 'completed', 'delayed', 'on_hold'].includes(String(activity?.status || '').toLowerCase());")
          s=s.replace('<label><input type="checkbox" data-layer="sites" checked> <span class="geo-dot"></span> Project sites</label>', '<label><input type="checkbox" data-layer="sites" checked> <span class="geo-dot"></span> Area Council coverage centres</label>')
          p.write_text(s)
          PY
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
      - name: Commit verified source
        run: |
          rm .github/workflows/geographic-activity-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden activity status mapping [geo-hardening-applied]"
          git push origin HEAD:feature/geographic-activity-audit
