name: Fix header regressions
on:
  push:
    branches: [feature/arrange-header-branding]
    paths: [.github/workflows/fix-header-regressions.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arrange-header-branding
          persist-credentials: true
      - name: Correct mobile menu and robust authentication selectors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/header-institutional-layout.css')
          text = p.read_text()
          old = '''  .dsh.pbd-root .dsh-head:has(> .merl-partner-logos) > .dsh-hamburger {
            grid-row: 2;
          }'''
          new = '''  .dsh.pbd-root .dsh-head:has(> .merl-partner-logos) > .dsh-hamburger {
            display: inline-flex;
            grid-row: 2;
          }'''
          assert text.count(old) == 1, 'Mobile menu rule changed unexpectedly'
          p.write_text(text.replace(old, new, 1))
          selectors = [
            ('frontend/qa/public-single-signin.mjs', "getByRole('button', { name: 'Sign in', exact: true })"),
            ('frontend/qa/header-inline-auth.mjs', "getByRole('button',{name:'Sign in',exact:true})"),
          ]
          for name, old in selectors:
            p = Path(name)
            text = p.read_text()
            assert old in text, f'Expected selector missing: {name}'
            p.write_text(text.replace(old, 'locator(\'button[type="submit"]\')'))
          PY
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/header-institutional-layout.css frontend/qa/public-single-signin.mjs frontend/qa/header-inline-auth.mjs
          git commit -m "Restore public mobile menu and use stable login test selectors"
          git push
