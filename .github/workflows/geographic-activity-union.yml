name: Geographic activity union

on:
  push:
    branches:
      - feature/geographic-activity-audit

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[geo-union-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/geographic-activity-audit
      - name: Allow activity-only Area Council records
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/components/GeographicCoverageMap.jsx')
          s=p.read_text()
          old="""  return [...grouped.values()].map((item) => {
    const areaActivities = activities.filter((activity) =>
      item.projectIds.has(activity.project_id)
      && normProvince(activity.province) === normProvince(item.province)
      && sameArea(activity.area_council, item.area));
    const implemented = areaActivities.filter(activityStarted);
    return {
      ...item,
      project_count: item.projectIds.size,
      activities: areaActivities,
      implemented_activities: implemented,
      activity_count: implemented.length,
    };
  });
}"""
          new="""  // Activity geography is also authoritative when explicitly entered on the
  // activity record. This allows activity implementation to appear even when
  // the project-level Area Council coverage table has not yet been completed.
  for (const activity of activities) {
    if (!activityStarted(activity) || !activity?.province || !activity?.area_council) continue;
    let item = [...grouped.values()].find((candidate) =>
      normProvince(candidate.province) === normProvince(activity.province)
      && sameArea(candidate.area, activity.area_council));
    if (!item) {
      const k = key(activity.province, activity.area_council);
      item = { province: activity.province, area: activity.area_council, projectIds: new Set(), projects: [] };
      grouped.set(k, item);
    }
  }

  return [...grouped.values()].map((item) => {
    const areaActivities = activities.filter((activity) =>
      normProvince(activity.province) === normProvince(item.province)
      && sameArea(activity.area_council, item.area));
    const implemented = areaActivities.filter(activityStarted);
    const activityProjectIds = new Set(implemented.map((activity) => activity.project_id).filter(Boolean));
    const activityProjects = [...activityProjectIds].map((id) => projectsById.get(id) || { id, name: 'Project record' });
    return {
      ...item,
      project_count: item.projectIds.size,
      activities: areaActivities,
      implemented_activities: implemented,
      activity_count: implemented.length,
      activity_projects: activityProjects,
    };
  });
}"""
          if old not in s: raise SystemExit('aggregate return block not found')
          s=s.replace(old,new,1)
          s=s.replace("const project = rec?.projects?.find((item) => item.id === activity.project_id);", "const project = [...(rec?.projects || []), ...(rec?.activity_projects || [])].find((item) => item.id === activity.project_id);")
          p.write_text(s)
          PY
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
      - name: Commit verified source
        run: |
          rm .github/workflows/geographic-activity-union.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Map verified activity locations across projects [geo-union-applied]"
          git push origin HEAD:feature/geographic-activity-audit
