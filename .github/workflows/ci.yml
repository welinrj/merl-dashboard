name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Typecheck, test & build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npx tsc --noEmit
        working-directory: frontend

      # Ahead of the build, so a broken check fails on the cheap step rather
      # than after a full bundle. The runner (scripts/run-tests.mjs) bundles
      # each test with esbuild before handing it to node --test, so it needs
      # node_modules but not dist.
      - run: npm test
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
