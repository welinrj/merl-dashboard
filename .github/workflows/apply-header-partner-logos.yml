name: Apply header partner logos
on:
  push:
    branches: [feature/header-partner-logos]
    paths: [.github/workflows/apply-header-partner-logos.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply scoped branding changes
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          
          root = Path('frontend')
          assets = ['docc-logo.png', 'mfat-logo.png']
          for asset in assets:
              assert (root / 'public' / asset).is_file(), f'Missing approved asset: {asset}'
          
          component = '''import './header-partner-logos.css';
          
          // Reuse the approved assets already supplied with the MERL portal.
          // BASE_URL keeps them working at the GitHub Pages project path.
          const asset = (name: string) => `${import.meta.env.BASE_URL}${name}`;
          
          export default function HeaderPartnerLogos() {
            return (
              <div className="merl-partner-logos" role="group" aria-label="Institutional partners">
                <img className="merl-partner-docc" src={asset('docc-logo.png')} alt="Department of Climate Change, Vanuatu" width={180} height={29} />
                <img className="merl-partner-mfat" src={asset('mfat-logo.png')} alt="New Zealand Ministry of Foreign Affairs and Trade" width={145} height={55} />
              </div>
            );
          }
          '''
          # The intrinsic proportions are preserved by CSS rather than the
          # optional HTML height hints, which are unnecessary for these assets.
          component = component.replace(' width={180} height={29}', '').replace(' width={145} height={55}', '')
          css = '''/* Shared institutional branding for public and authenticated headers. */
          .merl-partner-logos{display:flex;align-items:center;justify-content:flex-start;gap:16px;min-width:0;flex:0 1 auto}
          .merl-partner-logos img{display:block;max-width:100%;height:auto;max-height:44px;object-fit:contain;flex-shrink:1}
          .merl-partner-docc{width:180px}
          .merl-partner-mfat{width:145px}
          .dsh-head:has(> .merl-partner-logos){gap:16px}
          .dsh-head:has(> .merl-partner-logos) > .merl-partner-logos{position:relative;z-index:1}
          @media(max-width:1180px){
            .merl-partner-logos{gap:10px}
            .merl-partner-docc{width:155px}
            .merl-partner-mfat{width:125px}
          }
          @media(max-width:980px){
            .dsh-head:has(> .merl-partner-logos){flex-wrap:wrap}
            .dsh-head:has(> .merl-partner-logos) .dsh-head-actions{margin-left:auto}
            .pbd-root .dsh-head:has(> .merl-partner-logos) .pbd-head-brand{flex:1 1 180px}
          }
          @media(max-width:640px){
            .dsh-head:has(> .merl-partner-logos){display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:10px;row-gap:8px;align-items:center}
            .dsh-head:has(> .merl-partner-logos) > .dsh-hamburger{grid-column:1;grid-row:1}
            .pbd-root .dsh-head:has(> .merl-partner-logos) > .pbd-head-brand{grid-column:2;grid-row:1;min-width:0}
            .dsh-head:has(> .merl-partner-logos) > .merl-partner-logos{grid-column:1/-1;grid-row:2;justify-content:center;width:100%;margin:0}
            .dsh-head:has(> .merl-partner-logos) > .dsh-head-actions{grid-column:1/-1;grid-row:3;width:100%;margin:0;min-width:0;justify-content:flex-end}
            .merl-partner-docc{width:160px}
            .merl-partner-mfat{width:128px}
          }
          @media(max-width:360px){
            .merl-partner-logos{gap:8px}
            .merl-partner-docc{width:145px}
            .merl-partner-mfat{width:115px}
          }
          '''
          (root / 'src/components/HeaderPartnerLogos.tsx').write_text(component)
          (root / 'src/components/header-partner-logos.css').write_text(css)
          
          def replace_once(path, old, new):
              file = root / path
              source = file.read_text()
              assert source.count(old) == 1, f'Unexpected anchor in {path}: {old}'
              file.write_text(source.replace(old, new, 1))
          
          replace_once('src/App.tsx',
              "import GlobalSearch from './components/GlobalSearch';",
              "import GlobalSearch from './components/GlobalSearch';\nimport HeaderPartnerLogos from './components/HeaderPartnerLogos';")
          replace_once('src/App.tsx',
              '          <div className="dsh-head-actions">',
              '          <HeaderPartnerLogos />\n          <div className="dsh-head-actions">')
          replace_once('src/pages/PublicDashboard.jsx',
              "import PublicHeaderLogin from '../components/PublicHeaderLogin';",
              "import PublicHeaderLogin from '../components/PublicHeaderLogin';\nimport HeaderPartnerLogos from '../components/HeaderPartnerLogos';")
          replace_once('src/pages/PublicDashboard.jsx',
              '<div className="dsh-head-actions">',
              '<HeaderPartnerLogos/><div className="dsh-head-actions">')
          
          test = '''import assert from 'node:assert/strict';
          import { readFileSync, existsSync } from 'node:fs';
          import { test } from 'node:test';
          import { resolve } from 'node:path';
          const root = resolve(import.meta.dirname, '..');
          const read = p => readFileSync(resolve(root, p), 'utf8');
          test('both institutional logos are bundled and base-aware', () => {
            const component = read('src/components/HeaderPartnerLogos.tsx');
            for (const name of ['docc-logo.png', 'mfat-logo.png']) {
              assert.ok(existsSync(resolve(root, 'public', name)));
              assert.ok(component.includes(name));
            }
            assert.match(component, /import\\.meta\\.env\\.BASE_URL/);
            assert.match(component, /alt="Department of Climate Change, Vanuatu"/);
            assert.match(component, /alt="New Zealand Ministry of Foreign Affairs and Trade"/);
          });
          test('public and authenticated headers use one shared branding component', () => {
            assert.match(read('src/App.tsx'), /<HeaderPartnerLogos \\/>/);
            assert.match(read('src/pages/PublicDashboard.jsx'), /<HeaderPartnerLogos\\/>/);
          });
          test('branding stays in the header and does not replace access controls', () => {
            const app = read('src/App.tsx');
            const publicPage = read('src/pages/PublicDashboard.jsx');
            assert.match(app, /<GlobalSearch \\/>/);
            assert.match(app, /<NotificationBell user=\\{user\\} \\/>/);
            assert.match(publicPage, /<PublicHeaderLogin\\/>/);
            assert.match(read('src/components/header-partner-logos.css'), /object-fit:contain/);
          });
          '''
          (root / 'test/header-partner-logos.mjs').write_text(test)
          print('Applied shared DoCC/MFAT logos to both headers; existing assets, crest, and controls preserved.')
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx frontend/src/pages/PublicDashboard.jsx frontend/src/components/HeaderPartnerLogos.tsx frontend/src/components/header-partner-logos.css frontend/test/header-partner-logos.mjs
          git commit -m "Add DoCC and MFAT branding to MERL headers"
          git push origin HEAD:feature/header-partner-logos
