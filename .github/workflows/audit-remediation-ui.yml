name: Audit remediation UI

on:
  push:
    branches:
      - fix/audit-remediation-20260913

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-remediation-20260913
      - name: Apply patch
        run: python scripts/apply_audit_ui_patch.py
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
      - name: Commit verified source
        run: |
          rm scripts/apply_audit_ui_patch.py .github/workflows/audit-remediation-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore activity workflow and audit UX states [audit-ui-applied]"
          git push origin HEAD:fix/audit-remediation-20260913
