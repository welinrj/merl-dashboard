name: Preserve project profile assignments

on:
  push:
    branches:
      - fix/audit-remediation-20260913

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-remediation-20260913
      - name: Patch profile editor
        run: python scripts/preserve_project_profile_assignments.py
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
      - name: Commit verified fix and remove one-shot files
        run: |
          rm scripts/preserve_project_profile_assignments.py .github/workflows/preserve-profile-assignments.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve profile role assignments during edits [audit-profile-fix]"
          git push origin HEAD:fix/audit-remediation-20260913
