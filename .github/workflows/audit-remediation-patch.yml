name: Audit remediation source patch

on:
  push:
    branches: [fix/audit-remediation-20260913]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[audit-patch-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-remediation-20260913
      - name: Patch System administration panel safely
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/pages/AdminPanel.jsx')
          text = path.read_text()

          old = """  const load = useCallback(async () => {\n    setLoading(true); setErr('');\n    const { data, error } = await supabase.rpc('system_status');\n    if (error) setErr(dbErrorMessage(error));\n    else setStatus(data);\n    setLoading(false);\n  }, []);\n"""
          new = """  const load = useCallback(async () => {\n    setLoading(true); setErr('');\n    const { data, error } = await supabase.rpc('system_status');\n    if (error) {\n      setStatus(null);\n      setErr('System status could not be loaded. Check your connection or administrator permissions and try again.');\n    } else {\n      setStatus(data && typeof data === 'object' ? data : null);\n    }\n    setLoading(false);\n  }, []);\n"""
          if old not in text:
              raise SystemExit('System load block not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              "  const rlsTables = status?.rls_tables ?? [];\n  const rlsCovered = rlsTables.filter(t => t.rls_enabled).length;\n",
              "  const rlsTables = Array.isArray(status?.rls_tables) ? status.rls_tables : [];\n  const rlsCovered = rlsTables.filter(table => table?.rls_enabled === true).length;\n",
              1,
          )
          text = text.replace(
              "  if (err) return <div className=\"text-sm text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2\">{err}</div>;\n\n  return (\n    <div className=\"space-y-6\">\n",
              "  return (\n    <div className=\"space-y-6\">\n      {err && <div className=\"text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-3 flex flex-wrap items-center justify-between gap-3\" role=\"alert\"><span>{err}</span><button type=\"button\" onClick={load} className=\"font-semibold underline\">Retry</button></div>}\n      {!err && !status && <div className=\"text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-3 py-3\">System health information is not available. No health value has been assumed.</div>}\n",
              1,
          )
          text = text.replace(
              "            <span className=\"text-lg font-bold text-gray-900\">{status?.audit_row_count ?? 0}</span>\n",
              "            <span className=\"text-lg font-bold text-gray-900\">{status?.audit_row_count ?? '—'}</span>\n",
              1,
          )
          old_map = """          {rlsTables.map(t => (\n            <div key={t.table} className=\"flex items-center gap-2 bg-white border border-gray-100 rounded-lg px-3 py-2\">\n              <span className={`w-2 h-2 rounded-full flex-shrink-0 ${t.rls_enabled ? 'bg-green-500' : 'bg-red-500'}`} />\n              <span className=\"text-xs text-gray-600 font-mono truncate\">{t.table}</span>\n              {!t.rls_enabled && <span className=\"ml-auto text-[10px] text-red-600 font-semibold\">{t('adm.off')}</span>}\n            </div>\n          ))}\n"""
          new_map = """          {rlsTables.length === 0 ? (\n            <div className=\"sm:col-span-3 text-sm text-gray-500 bg-gray-50 border border-gray-100 rounded-lg px-3 py-3\">Row-level security status has not been reported.</div>\n          ) : rlsTables.map(table => (\n            <div key={table.table} className=\"flex items-center gap-2 bg-white border border-gray-100 rounded-lg px-3 py-2\">\n              <span className={`w-2 h-2 rounded-full flex-shrink-0 ${table.rls_enabled ? 'bg-green-500' : 'bg-red-500'}`} />\n              <span className=\"text-xs text-gray-600 font-mono truncate\">{table.table}</span>\n              {!table.rls_enabled && <span className=\"ml-auto text-[10px] text-red-600 font-semibold\">{t('adm.off')}</span>}\n            </div>\n          ))}\n"""
          if old_map not in text:
              raise SystemExit('RLS map block not found')
          text = text.replace(old_map, new_map, 1)
          path.write_text(text)
          PY
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/AdminPanel.jsx
          git commit -m "Fix System tab crash and recovery states [audit-patch-applied]"
          git push origin HEAD:fix/audit-remediation-20260913
