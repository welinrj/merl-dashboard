name: Portal browser QA

on:
  pull_request:
  push:
    branches: [main]

jobs:
  browser-qa:
    name: Browser interaction, roles, auth and data UX
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright for QA harness
        working-directory: frontend
        run: |
          npm install --no-save playwright@1.64.0
          npx playwright install --with-deps chromium
          sudo mkdir -p /opt/pw-browsers
          PW_EXECUTABLE="$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")"
          sudo ln -sf "$PW_EXECUTABLE" /opt/pw-browsers/chromium

      - name: Build portal
        working-directory: frontend
        run: npm run build

      - name: Start built portal
        working-directory: frontend
        run: |
          nohup npx vite preview --port 5199 --strictPort > /tmp/merl-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5199 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/merl-preview.log
          exit 1

      - name: Validate personal tasks and guided reporting
        working-directory: frontend
        run: node qa/my-tasks-checklist.mjs

      - name: Validate role workflow remediations
        working-directory: frontend
        run: node qa/role-workflow-regressions.mjs

      - name: Retain role assignment previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-assignment-previews
          path: frontend/qa-artifacts/role-assignments-*.png
          if-no-files-found: ignore

      - name: Validate figure explanations and report readiness
        working-directory: frontend
        run: node qa/result-assurance.mjs

      - name: Validate Results Framework reading and editing on phones
        working-directory: frontend
        env:
          STUB_FILE: qa/fixture.json
        run: node qa/results-framework-usability.mjs

      - name: Retain Results Framework previews
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: results-framework-preview
          path: frontend/qa-artifacts/header-framework-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate labelled dashboard filters on phones and desktop
        working-directory: frontend
        env:
          STUB_FILE: qa/fixture.json
        run: node qa/dashboard-filters.mjs

      - name: Validate account context and shared reporting periods
        working-directory: frontend
        run: node qa/workspace-context.mjs

      - name: Validate inline header authentication
        if: ${{ success() || failure() }}
        working-directory: frontend
        env:
          STUB_FILE: qa/fixture.json
        run: node qa/header-inline-auth.mjs

      - name: Validate password recovery links and delivery failures
        working-directory: frontend
        run: node qa/password-recovery.mjs

      - name: Validate simple project editing on a phone
        working-directory: frontend
        env:
          STUB_FILE: qa/fixture.json
        run: node qa/project-details.mjs

      - name: Validate dashboard guides and simple reporting on a phone
        working-directory: frontend
        env:
          STUB_FILE: qa/fixture.json
        run: node qa/workspace-usability.mjs

      - name: Validate selected project portfolio reports
        working-directory: frontend
        env:
          STUB_FILE: qa/fixture.json
        run: node qa/project-portfolio-reports.mjs

      - name: Retain report export samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-export-samples
          path: |
            frontend/qa-artifacts/comparison-report.docx
            frontend/qa-artifacts/comparison-report.pdf
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate phone menus during session renewal
        working-directory: frontend
        env:
          STUB_FILE: qa/fixture.json
        run: node qa/mobile-menu-stability.mjs

      - name: Validate public phone sidebar branding
        working-directory: frontend
        run: node qa/public-sidebar-brand.mjs

      - name: Validate role permission matrix
        working-directory: frontend
        env:
          STUB_FILE: qa/fixture.json
        run: node qa/permission-matrix.mjs

      - name: Validate institutional header alignment and mobile controls
        working-directory: frontend
        env:
          STUB_FILE: qa/fixture.json
        run: node qa/header-brand-layout.mjs

      - name: Retain header preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: header-preview
          path: frontend/qa-artifacts/header-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate administration role row colours
        working-directory: frontend
        run: node qa/admin-role-colors.mjs

      - name: Validate executive KPI alignment and score gauges
        working-directory: frontend
        env:
          STUB_FILE: qa/fixture.json
        run: node qa/kpi-alignment.mjs

      - name: Audit core dashboard pages
        working-directory: frontend
        env:
          STUB_FILE: qa/fixture.json
        run: node qa/page-smoke.mjs

      - name: Sweep visible controls
        working-directory: frontend
        env:
          STUB_FILE: qa/fixture.json
        run: node qa/sweep-controls.mjs

      - name: Validate beneficiary totals reconcile across pages
        working-directory: frontend
        env:
          STUB_FILE: qa/fixture-multiperiod.json
        run: node qa/beneficiary-reconciliation.mjs

      - name: Validate evidence intelligence states
        working-directory: frontend
        env:
          STUB_FILE: qa/fixture.json
        run: node qa/evidence-intelligence.mjs

      - name: Validate auth lifecycle
        working-directory: frontend
        env:
          STUB_FILE: qa/fixture.json
        run: node qa/auth-lifecycle.mjs

      - name: Validate KPI, filters, map, export, responsive and a11y
        working-directory: frontend
        env:
          STUB_FILE: qa/fixture.json
        run: node qa/data-and-ux.mjs

      - name: Validate read-failure guard
        if: ${{ success() || failure() }}
        working-directory: frontend
        run: node qa/read-failure-guard.mjs

      - name: Validate anonymous public dashboard
        working-directory: frontend
        run: node qa/public-dashboard.mjs

      - name: Validate single public sign-in
        if: ${{ success() || failure() }}
        working-directory: frontend
        run: node qa/public-single-signin.mjs

      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/merl-preview.log || true
