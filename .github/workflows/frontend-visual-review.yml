name: Frontend visual review
on:
  push:
    branches: [audit/frontend-visual-review]
jobs:
  sidebar:
    name: Sidebar and Results layout
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install browser QA
        working-directory: frontend
        run: |
          npm install --no-save playwright@1.64.0
          npx playwright install --with-deps chromium
          sudo mkdir -p /opt/pw-browsers
          PW_EXECUTABLE="$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")"
          sudo ln -sf "$PW_EXECUTABLE" /opt/pw-browsers/chromium
      - run: npm run build
        working-directory: frontend
      - name: Start built portal
        working-directory: frontend
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 5199 --strictPort > /tmp/sidebar-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5199 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sidebar-preview.log
          exit 1
      - name: Capture frontend visual review
        working-directory: frontend
        run: node qa/frontend-visual-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-visual-review
          path: frontend/qa-artifacts/audit-*
          retention-days: 7
