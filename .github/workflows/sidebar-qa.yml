name: Sidebar design QA
on:
  pull_request:
    paths:
      - 'frontend/src/sidebar-refinement.css'
      - 'frontend/src/island-resilience.css'
      - 'frontend/src/App.tsx'
      - 'frontend/src/main.jsx'
      - 'frontend/qa/sidebar-integration.mjs'
      - '.github/workflows/sidebar-qa.yml'
jobs:
  sidebar:
    name: Desktop and mobile sidebar
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install browser QA
        working-directory: frontend
        run: |
          npm install --no-save playwright@1.64.0
          npx playwright install --with-deps chromium
      - run: npm run build
        working-directory: frontend
      - name: Start built portal
        working-directory: frontend
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 5199 --strictPort > /tmp/sidebar-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5199 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sidebar-preview.log
          exit 1
      - name: Check sidebar geometry, type, navigation and mobile drawer
        working-directory: frontend
        run: node qa/sidebar-integration.mjs
      - name: Retain sidebar previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-previews
          path: frontend/qa-artifacts/sidebar-*.png
          if-no-files-found: ignore
          retention-days: 7
