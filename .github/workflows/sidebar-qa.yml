name: Workspace layout QA
on:
  pull_request:
    paths:
      - 'frontend/src/sidebar-refinement.css'
      - 'frontend/src/island-resilience.css'
      - 'frontend/src/pages/ResultsWorkspace.jsx'
      - 'frontend/src/pages/ResultsWorkspace.css'
      - 'frontend/qa/results-scroll-layout.mjs'
      - 'frontend/src/App.tsx'
      - 'frontend/src/main.jsx'
      - 'frontend/qa/sidebar-integration.mjs'
      - '.github/workflows/sidebar-qa.yml'
jobs:
  sidebar:
    name: Sidebar and Results layout
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install browser QA
        working-directory: frontend
        run: |
          npm install --no-save playwright@1.64.0
          npx playwright install --with-deps chromium
          sudo mkdir -p /opt/pw-browsers
          PW_EXECUTABLE="$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")"
          sudo ln -sf "$PW_EXECUTABLE" /opt/pw-browsers/chromium
      - run: npm run build
        working-directory: frontend
      - name: Start built portal
        working-directory: frontend
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 5199 --strictPort > /tmp/sidebar-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5199 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sidebar-preview.log
          exit 1
      - name: Check sidebar geometry, type, navigation and mobile drawer
        working-directory: frontend
        run: node qa/sidebar-integration.mjs
      - name: Check Results scrolling and editing
        working-directory: frontend
        run: |
          node qa/results-scroll-layout.mjs
          node qa/results-framework-usability.mjs
      - name: Retain workspace previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-layout-previews
          path: |
            frontend/qa-artifacts/sidebar-*.png
            frontend/qa-artifacts/results-scroll-*.png
            frontend/qa-artifacts/header-framework-*.png
          if-no-files-found: ignore
          retention-days: 7
