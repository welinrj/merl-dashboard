name: Apply administration table integration
on:
  push:
    branches: [feature/admin-datatable]
    paths:
      - '.github/workflows/apply-admin-datatable.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-datatable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Integrate existing administration screens
        run: |
          node scripts/apply-admin-datatable.mjs
          node scripts/split-admin-table.mjs
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/AdminPanel.jsx frontend/src/components/ui/AdminDataTable.jsx frontend/src/components/ui/adminTableModel.js
          git rm scripts/apply-admin-datatable.mjs scripts/split-admin-table.mjs .github/workflows/apply-admin-datatable.yml
          git commit -m "Integrate administration data tables with existing workflows"
          git push origin HEAD:feature/admin-datatable
