# =============================================================================
# nginx.conf — DoCC M&E Monitoring Platform (DMP) Reverse Proxy
# Project: Vanuatu Loss and Damage Fund Development Project
# =============================================================================
#
# Upstream layout:
#   frontend       :3000   React SPA served by nginx (dmp-frontend container)
#   supabase-kong  :8000   Self-hosted Supabase API gateway (separate compose
#                          project on the shared `dmp-net` network)
#
# Domains (replace before deployment — see docs/migration-runbook.md §4):
#   dmp.gov.vu       → frontend
#   api.dmp.gov.vu   → Supabase (Auth, REST, Realtime, Storage)
#
# TLS: certificates are provisioned into the `certbot_certs` volume either by
# the certbot service (Let's Encrypt, requires outbound internet) or by
# manually installing Government-issued certificates (runbook §8.2).
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # Don't advertise the nginx version in responses or error pages.
    server_tokens off;

    # ── Rate limiting ────────────────────────────────────────────────────────
    # Sign-in is the endpoint worth spending real limits on: it is the one place
    # an attacker can guess a credential, and a government portal's account list
    # is small and guessable (firstname.lastname@…). 5 requests/minute per IP
    # with a burst of 5 lets a person mistype a password a few times and stops
    # an automated guessing run dead.
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
    # The rest of the auth surface (token refresh, recovery, sign-out) is used
    # legitimately far more often, so it gets a looser limit that still caps
    # abuse.
    limit_req_zone $binary_remote_addr zone=auth_general:10m rate=60r/m;
    # The cached aggregate sidecar is public and unauthenticated.
    limit_req_zone $binary_remote_addr zone=cache_api:10m rate=120r/m;
    # A limited request is a client error, not a server error.
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # Uploads (CSV/XLSX datasets, photos, PDF evidence) go through Supabase
    # Storage on the api host; 50 MB matches the application-level limit.
    client_max_body_size 50m;

    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_types         text/plain text/css application/json application/javascript
                       application/geo+json image/svg+xml;

    upstream frontend {
        server dmp-frontend:3000;
    }

    # Redis-backed caching sidecar (shared aggregate results).
    upstream cache_service {
        server dmp-cache:8080;
    }

    # Supabase API gateway (Kong) from the self-hosted Supabase compose
    # project. The container name is defined in supabase/docker/.env
    # (KONG_HTTP_PORT). Both stacks share the external `dmp-net` network.
    upstream supabase {
        server supabase-kong:8000;
    }

    # ── HTTP: ACME challenges + redirect everything else to HTTPS ───────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS: application (dmp.gov.vu) ──────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name dmp.gov.vu;                       # CHANGE to final domain

        ssl_certificate     /etc/letsencrypt/live/dmp.gov.vu/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dmp.gov.vu/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy        "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

        # Content-Security-Policy. The built bundle carries no inline <script>
        # (checked against dist/index.html), so scripts are restricted to this
        # origin plus the one CDN the mapping library is loaded from — which is
        # the control that actually stops an injected <script> from running.
        #
        # style-src keeps 'unsafe-inline' because the pages style themselves
        # with inline style attributes and <style> blocks throughout; removing
        # that would mean restyling the portal, and an inline stylesheet cannot
        # exfiltrate data the way an inline script can.
        #
        # The map hosts are listed explicitly rather than with a wildcard so a
        # new third-party dependency has to be added here deliberately.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://server.arcgisonline.com https://services.arcgisonline.com https://services.arcgis.com https://gis.unocha.org; connect-src 'self' https://api.dmp.gov.vu wss://api.dmp.gov.vu https://services.arcgis.com https://gis.unocha.org; worker-src 'self' blob:; upgrade-insecure-requests" always;

        # One IP does not need hundreds of simultaneous connections.
        limit_conn conn_per_ip 50;

        # Cached shared aggregates (served from Redis via the sidecar). Same
        # origin as the app, so the browser needs no CORS or extra host.
        location /api-cache/ {
            limit_req zone=cache_api burst=30 nodelay;
            proxy_pass         http://cache_service/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout    5s;
        }

        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ── HTTPS: Supabase API (api.dmp.gov.vu) ─────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name api.dmp.gov.vu;                   # CHANGE to final domain

        ssl_certificate     /etc/letsencrypt/live/dmp.gov.vu/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dmp.gov.vu/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # This host serves JSON, never a document, so nothing here should ever
        # be framed or treated as a page.
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

        limit_conn conn_per_ip 50;

        # The shared proxy settings every location below needs. Kept in a
        # snippet-style block so adding a rate limit to one path does not mean
        # re-typing (and drifting) the proxying itself.
        # ── Sign-in: the credential-guessing endpoint ────────────────────────
        # /auth/v1/token is what signInWithPassword calls. Everything else on
        # the auth surface stays on the looser limit so a working session is
        # never throttled mid-task.
        location = /auth/v1/token {
            limit_req zone=auth_login burst=5 nodelay;
            proxy_pass         http://supabase;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # Password recovery and account creation are also credential-adjacent.
        location ~ ^/auth/v1/(recover|signup|otp|magiclink|verify)$ {
            limit_req zone=auth_login burst=5 nodelay;
            proxy_pass         http://supabase;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        location /auth/v1/ {
            limit_req zone=auth_general burst=30 nodelay;
            proxy_pass         http://supabase;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        location / {
            proxy_pass         http://supabase;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Supabase Realtime uses WebSockets.
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}
